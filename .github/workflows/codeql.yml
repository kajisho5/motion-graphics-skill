name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 04:23 UTC -- an off-the-hour time, not a coordinated pattern that spikes GitHub's schedulers.
    - cron: '23 4 * * 1'

concurrency:
  # a newer commit on a pull request cancels the runs of the commit it replaces; every other run (main, tags,
  # schedule, manual) has its own group and is never cancelled
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # This repository's own source (src/, tests/, .github/scripts/) is pure Python; vendor/ffmpeg-skill is
        # cloned at test time by tests.yml and is not part of this repository's tree, so there is nothing else
        # here for CodeQL to analyze.
        language: ['python']
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
