name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # ffmpeg-skill releases independently and often: run against its current main every day, so a release that breaks
  # this skill shows up even when nothing here changed (there is no version window to hide behind, ADR-18)
  schedule:
    - cron: "17 6 * * *"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ffmpeg-skill ${{ matrix.ffmpeg_skill_label }}
    strategy:
      fail-fast: false
      matrix:
        # every platform runs against ffmpeg-skill main (the newest release); one Linux job keeps the oldest commit
        # this skill is verified against (ffmpeg-skill 0.12.5: --crf only, no --overwrite, a single _common.py), so
        # both ends of the detected-capability range stay covered
        include:
          - {os: ubuntu-latest, python: "3.9", ffmpeg_skill_ref: main, ffmpeg_skill_label: main}
          - {os: ubuntu-latest, python: "3.11", ffmpeg_skill_ref: main, ffmpeg_skill_label: main}
          - {os: windows-latest, python: "3.11", ffmpeg_skill_ref: main, ffmpeg_skill_label: main}
          - {os: macos-latest, python: "3.11", ffmpeg_skill_ref: main, ffmpeg_skill_label: main}
          - {os: ubuntu-latest, python: "3.11", ffmpeg_skill_ref: 87c84f23b4546379795107a49524f4d9803c9cee, ffmpeg_skill_label: "0.12.5 (oldest verified)"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install ffmpeg (macOS)
        # macos-latest runners ship with an ffmpeg already on PATH, so `brew install ffmpeg` is a silent no-op
        # against that pre-existing (often minimal, no libfreetype/drawtext) build. Install a known full static
        # build instead so drawtext/fontconfig are actually available, and verify it before running any tests.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -sSL https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip -o ffmpeg.zip
          curl -sSL https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip -o ffprobe.zip
          unzip -o ffmpeg.zip -d /usr/local/bin
          unzip -o ffprobe.zip -d /usr/local/bin
          chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          /usr/local/bin/ffmpeg -version
          /usr/local/bin/ffmpeg -filters 2>&1 | grep -q drawtext || { echo "::error::installed ffmpeg is missing the drawtext filter"; exit 1; }
          # Apple Silicon runners put /opt/homebrew/bin (a pre-installed, possibly minimal ffmpeg) ahead of
          # /usr/local/bin on PATH; prepend it here so later steps resolve the full build just installed.
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Clone ffmpeg-skill (${{ matrix.ffmpeg_skill_label }})
        shell: bash
        env:
          FFMPEG_SKILL_REF: ${{ matrix.ffmpeg_skill_ref }}
        run: |
          if [ "$FFMPEG_SKILL_REF" = "main" ]; then
            git clone --depth 1 https://github.com/kajisho5/ffmpeg-skill vendor/ffmpeg-skill
          else
            git clone https://github.com/kajisho5/ffmpeg-skill vendor/ffmpeg-skill
            git -C vendor/ffmpeg-skill checkout "$FFMPEG_SKILL_REF"
          fi
          echo "ffmpeg-skill $(git -C vendor/ffmpeg-skill rev-parse HEAD) $(grep -m1 '"version"' vendor/ffmpeg-skill/package.json)"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyflakes

      - name: Lint
        run: python -m pyflakes src tests

      - name: Unit test
        shell: bash
        env:
          MOTION_GRAPHICS_FFMPEG_SKILL_DIR: ${{ github.workspace }}/vendor/ffmpeg-skill
        run: python -m pytest -q

      - name: doctor --json
        shell: bash
        run: motion-graphics doctor --json --ffmpeg-skill vendor/ffmpeg-skill

      - name: contract --json is valid JSON
        shell: bash
        run: motion-graphics skill --json | python -c "import json,sys; json.load(sys.stdin)"
