name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # ffmpeg-skill releases independently and often: run against its current main every day, so a release that breaks
  # this skill shows up even when nothing here changed (there is no version window to hide behind, ADR-18)
  schedule:
    - cron: "17 6 * * *"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ffmpeg-skill ${{ matrix.ffmpeg_skill_label }}
    strategy:
      fail-fast: false
      matrix:
        # every platform runs against ffmpeg-skill main (the newest release); one Linux job keeps the oldest commit
        # this skill is verified against (ffmpeg-skill 0.12.5: --crf only, no --overwrite, a single _common.py), so
        # both ends of the detected-capability range stay covered
        #
        # Linux jobs are pinned to ubuntu-24.04, not ubuntu-latest: when "ubuntu-latest" silently became 26.04,
        # two things broke that are both about that image, not about this skill's own code (see the fix PR this
        # comment shipped with for the evidence) -- (1) actions/setup-python has no Python 3.9 build for 26.04 at
        # all yet (only 22.04/24.04; requires-python = ">=3.9" in pyproject.toml still means 3.9 needs covering,
        # not dropping), and (2) the newer apt ffmpeg that 26.04 ships drifted `test_countdown_draws_a_digit_
        # throughout_its_window`'s empirically-calibrated luma threshold just below its margin (2.888 vs > 3.0;
        # the same drifting-"latest"-toolchain failure mode ADR-18/issue #16 already hit on macOS, fixed there by
        # pinning Homebrew's ffmpeg-full instead of whatever's current -- this is the same fix, for apt on Linux).
        # Bump past 24.04 deliberately, not by just following ubuntu-latest again, once there's a reason to.
        include:
          - {os: ubuntu-24.04, python: "3.9", ffmpeg_skill_ref: main, ffmpeg_skill_label: main}
          - {os: ubuntu-24.04, python: "3.11", ffmpeg_skill_ref: main, ffmpeg_skill_label: main}
          - {os: windows-latest, python: "3.11", ffmpeg_skill_ref: main, ffmpeg_skill_label: main}
          - {os: macos-latest, python: "3.11", ffmpeg_skill_ref: main, ffmpeg_skill_label: main}
          - {os: ubuntu-24.04, python: "3.11", ffmpeg_skill_ref: 87c84f23b4546379795107a49524f4d9803c9cee, ffmpeg_skill_label: "0.12.5 (oldest verified)"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-cjk

      - name: Install ffmpeg (macOS)
        # Homebrew's plain `ffmpeg` formula is a lean build without libfreetype/drawtext, and the runner may
        # already have it on PATH. `ffmpeg-full` is Homebrew's complete build (drawtext, fontconfig); it is
        # keg-only, so put its bin first on PATH and verify drawtext before any test runs.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ffmpeg-full
          FULL_BIN="$(brew --prefix ffmpeg-full)/bin"
          "$FULL_BIN/ffmpeg" -version
          "$FULL_BIN/ffmpeg" -hide_banner -filters 2>&1 | grep -q drawtext || { echo "::error::ffmpeg-full is missing the drawtext filter"; exit 1; }
          echo "$FULL_BIN" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Clone ffmpeg-skill (${{ matrix.ffmpeg_skill_label }})
        shell: bash
        env:
          FFMPEG_SKILL_REF: ${{ matrix.ffmpeg_skill_ref }}
        run: |
          if [ "$FFMPEG_SKILL_REF" = "main" ]; then
            git clone --depth 1 https://github.com/kajisho5/ffmpeg-skill vendor/ffmpeg-skill
          else
            git clone https://github.com/kajisho5/ffmpeg-skill vendor/ffmpeg-skill
            git -C vendor/ffmpeg-skill checkout "$FFMPEG_SKILL_REF"
          fi
          echo "ffmpeg-skill $(git -C vendor/ffmpeg-skill rev-parse HEAD) $(grep -m1 '"version"' vendor/ffmpeg-skill/package.json)"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyflakes

      - name: Lint
        run: python -m pyflakes src tests

      - name: Unit test
        shell: bash
        env:
          MOTION_GRAPHICS_FFMPEG_SKILL_DIR: ${{ github.workspace }}/vendor/ffmpeg-skill
        run: python -m pytest -q

      - name: doctor --json
        shell: bash
        run: motion-graphics doctor --json --ffmpeg-skill vendor/ffmpeg-skill

      - name: contract --json is valid JSON
        shell: bash
        run: motion-graphics skill --json | python -c "import json,sys; json.load(sys.stdin)"
