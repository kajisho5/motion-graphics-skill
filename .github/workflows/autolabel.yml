name: Autolabel PRs

# pull_request_target (not pull_request) so this also runs for PRs opened from forks: it executes with the base
# repository's permissions/secrets rather than the fork's, using the fork PR only as metadata (title, branch
# name, changed file list) -- release-drafter's autolabeler never checks out the PR's own code to do this, and
# neither does this workflow, so a fork cannot use its own code to influence the labels applied to it.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  autolabel:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels from .github/release-drafter.yml's autolabeler rules
        uses: release-drafter/release-drafter@v6
        with:
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
