# Drives two workflows from one config:
#   - .github/workflows/autolabel.yml applies the `autolabeler` rules below to opened/updated PRs.
#   - .github/workflows/release.yml runs this in dry-run mode (disable-releaser: true) purely to resolve the
#     next version number from whatever labels PRs merged since the last tag carry (version-resolver below);
#     it never uses this file's `template`/`body` output -- the actual CHANGELOG.md and GitHub Release notes are
#     generated separately from `git log`, read at runtime, to avoid interpolating PR-title text into shell
#     syntax (see release.yml's header comment).
#
# No label at all -> `default: patch` below. That is deliberate, not a gap: an unlabeled PR (or one that matches
# none of the autolabeler rules) should never block or fail the release, just take the most conservative bump.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '💥 Breaking Changes'
    labels: ['major', 'breaking']
  - title: '🚀 Features'
    labels: ['feature', 'minor', 'enhancement']
  - title: '🐛 Fixes'
    labels: ['fix', 'bug']
  - title: '🧰 Maintenance'
    labels: ['chore', 'docs', 'test', 'ci', 'refactor']

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['feature', 'minor', 'enhancement']
  patch:
    labels: ['fix', 'bug', 'chore', 'docs', 'test', 'ci', 'refactor']
  default: patch

# Matched against this repository's own observed conventions: PR titles are plain imperative sentences (e.g.
# "Implement bug element type", "Reconcile FLAGS_USED..."), not conventional-commit prefixes, and branch names
# loosely follow feature/*, fix/*, claude/* (this repo's own catch-all dev-branch prefix). Branch/title matching
# is best-effort, not exact for every historical PR (a couple of past branches used "fix/" for what was
# substantively a feature) -- a maintainer can always add/correct a label by hand before merge; the
# `default: patch` above is the safety net when a rule under- or over-matches.
autolabeler:
  - label: 'major'
    title:
      - '/^(major|breaking)[:!( ]/i'
    body:
      - '/BREAKING CHANGE/'
  - label: 'feature'
    branch:
      - '/^feature\//i'
    title:
      - '/^implement /i'
  - label: 'fix'
    branch:
      - '/^fix\//i'
    title:
      - '/^fix /i'
  - label: 'docs'
    branch:
      - '/^docs\//i'
    files:
      - '*.md'
      - 'docs/**'
  - label: 'chore'
    branch:
      - '/^(chore|claude)\//i'
    title:
      - '/^(refresh|reconcile|audit) /i'

template: |
  ## Changes

  $CHANGES
